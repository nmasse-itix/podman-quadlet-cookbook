; An explicit list rather than autoload: autoload brings some three hundred
; modules, most of which have no configuration and decline to load with an
; error, which buries the messages that matter.
;
; What is listed is what calls between local SIP phones need: PJSIP, RTP, the
; static dialplan, Dial() and the codecs the phones offer. A feature that needs
; another module needs a line here.
[modules]
autoload = no

; Configuration storage for PJSIP
load => res_sorcery_config.so
load => res_sorcery_memory.so
load => res_sorcery_astdb.so

; PJSIP: transport, registration, authentication, calls
load => res_pjproject.so
load => res_pjsip.so
load => res_pjsip_session.so
load => res_pjsip_pubsub.so
load => res_pjsip_authenticator_digest.so
load => res_pjsip_endpoint_identifier_user.so
load => res_pjsip_registrar.so
load => res_pjsip_sdp_rtp.so
load => res_pjsip_caller_id.so
load => res_pjsip_dtmf_info.so
load => res_pjsip_rfc3326.so
load => res_pjsip_diversion.so
load => res_pjsip_header_funcs.so
; Transfer button of the phones (SIP REFER)
load => res_pjsip_refer.so
load => res_pjsip_logger.so
load => chan_pjsip.so

; Media
load => res_rtp_asterisk.so
load => res_timing_timerfd.so
load => bridge_simple.so
load => bridge_native_rtp.so
load => codec_g722.so
load => codec_alaw.so
load => codec_ulaw.so
load => codec_a_mu.so

; Dialplan
load => pbx_config.so
load => app_dial.so
load => func_callerid.so

; "channel originate" from the CLI, to test a phone without a second one
load => res_clioriginate.so

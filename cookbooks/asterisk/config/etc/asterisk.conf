; Asterisk runs as UID 10036, which owns nothing in the image: every directory
; it writes to is moved out of the image, onto a path the container mounts.
;
; - /var/lib/quadlets/asterisk: the internal database and the spool, mounted
;   from the host. Nothing there is precious: no voicemail, no recordings.
; - /run/asterisk: the control socket, on a tmpfs.
;
; The read-only directories stay where the Alpine package puts them.
[directories]
astetcdir => /etc/asterisk
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => /var/lib/quadlets/asterisk
astkeydir => /var/lib/asterisk
astdatadir => /var/lib/asterisk
astagidir => /var/lib/asterisk/agi-bin
astspooldir => /var/lib/quadlets/asterisk/spool
astrundir => /run/asterisk
astlogdir => /var/lib/quadlets/asterisk/log
astsbindir => /usr/sbin

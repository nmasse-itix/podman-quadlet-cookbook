; Default transfer and pickup settings. The phones transfer with SIP REFER,
; handled by res_pjsip_refer, not with DTMF feature codes.
[general]
; Dialled by a phone, picks up a call ringing on a phone of its pickup groups
; (named_pickup_group and named_call_group of pjsip.conf). Handled by chan_pjsip
; before the dialplan. *8 is the default, written here to be found.
pickupexten = *8

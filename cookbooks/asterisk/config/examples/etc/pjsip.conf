; Example: two phones, 101 and 102, registering over UDP.
; The operator provides the real file, with real secrets.
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[phone](!)
type = endpoint
context = phones
disallow = all
allow = g722
allow = alaw
allow = ulaw
direct_media = no
dtmf_mode = rfc4733

[phone-auth](!)
type = auth
auth_type = userpass

[phone-aor](!)
type = aor
max_contacts = 1
remove_existing = yes
qualify_frequency = 60

[101](phone)
auth = 101
aors = 101
callerid = "Phone 101" <101>

[101](phone-auth)
username = 101
password = example-only-101

[101](phone-aor)

[102](phone)
auth = 102
aors = 102
callerid = "Phone 102" <102>

[102](phone-auth)
username = 102
password = example-only-102

[102](phone-aor)

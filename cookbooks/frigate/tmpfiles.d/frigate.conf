# Precious data, on the virtiofs mount so that the host's ZFS snapshots and
# backups pick it up:
#   - config: config.yml, the SQLite database (events, users), the model cache;
#   - media: the recordings, the snapshots, the clips and the exports.
# The "$" marks them for removal on `systemd-tmpfiles --purge` (i.e. `make
# uninstall`).
d$ /var/lib/virtiofs/data/frigate 0750 root root -
d$ /var/lib/virtiofs/data/frigate/config 0750 root root -
d$ /var/lib/virtiofs/data/frigate/media 0750 root root -
